<!doctype html>
<html lang="en" data-theme="dusk-ember">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LucID</title>
    <meta name="description" content="Ultra-lightweight note application with client-side AES-256-GCM end-to-end encryption, native Markdown, and zero subscriptions." />
    <meta property="og:title" content="LucID — Self-Hosted Encrypted Note App" />
    <meta property="og:description" content="Ultra-lightweight note application with client-side AES-256-GCM end-to-end encryption, native Markdown, and zero subscriptions." />
    <meta property="og:image" content="assets/branding/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LucID — Self-Hosted Encrypted Note App" />
    <meta name="twitter:description" content="Ultra-lightweight note application with client-side AES-256-GCM end-to-end encryption, native Markdown, and zero subscriptions." />
    <meta name="twitter:image" content="assets/branding/logo.png" />
    <link rel="icon" type="image/png" href="assets/branding/favicon.png" />
    <!-- Clean Custom 2026 Design System -->
    <!-- Content-Security-Policy: scripts may load ONLY from this origin, so injected
       markup cannot execute inline JS even if the sanitizer were bypassed (S-04/S-11).
       This meta is defense in depth and must stay identical to CSP_HEADER in server.js,
       which is the ENFORCING copy: browsers ignore frame-ancestors in a meta policy
       (S-12), so clickjacking protection comes from the header alone. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-ZMl5Q4bsZIF4pDz2yEQ03V8J2tcYWAFBcZl4acDp6Yw='; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- Theme before first paint: reads the stored choice and stamps <html> so no
       frame renders in the wrong theme. Hashed in the CSP (header + meta). -->
    <script>
      try {
        var t = localStorage.getItem("lucid-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css?v=2.11.0-dev" />
    <!-- Vendored locally (pinned): no third-party CDN can inject code into this origin (S-08/S-09/S-10) -->
    <link
      id="hljs-theme"
      rel="stylesheet"
      href="vendor/hljs-styles/github-dark.min.css"
    />
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/highlight.min.js"></script>
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- LEFT SIDEBAR (EXPANDED BY DEFAULT) -->
      <nav id="sidebar-left" class="sidebar left-pane">
        <header class="brand-header">
          <strong class="brand-logo">
            <img
              src="assets/branding/logo.png"
              class="brand-logo-img"
              alt="LucID"
            />
          </strong>
          <button
            id="btn-toggle-left"
            class="icon-btn"
            title="Collapse sidebar"
            aria-label="Collapse sidebar"
          >
            <svg
              class="icon-svg pane-hide-left"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path
                d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7zM9 2v20"
              />
            </svg>
          </button>
        </header>

        <div class="sidebar-body">
          <!-- STREAMLINED EXPLORER TOOLBAR ROW -->
          <div class="tree-header-row" id="tree-header-row">
            <div class="toolbar-cluster">
              <div class="explorer-toolbar-pill">
                <button
                  id="btn-mode-folders"
                  class="explorer-pill-btn active"
                  title="Folders View"
                  aria-label="Folders View"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M21 7v10c0 3-1.5 5-5 5H8c-3.5 0-5-2-5-5V7c0-3 1.5-5 5-5h8c3.5 0 5 2 5 5z"
                    />
                    <path
                      d="M15.5 2v7.86c0 .44-.52.66-.84.37l-2.32-2.14a.496.496 0 00-.68 0l-2.32 2.14c-.32.29-.84.07-.84-.37V2h7zM13.25 14h4.25M9 18h8.5"
                    />
                  </svg>
                </button>
                <button
                  id="btn-mode-tags"
                  class="explorer-pill-btn"
                  title="Tags View"
                  aria-label="Tags View"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M4.405 15.526l4.53 4.53a4.78 4.78 0 006.75 0l4.39-4.39a4.78 4.78 0 000-6.75l-4.54-4.52a4.75 4.75 0 00-3.6-1.39l-5 .24c-2 .09-3.59 1.68-3.69 3.67l-.24 5c-.06 1.35.45 2.66 1.4 3.61z"
                    />
                    <path d="M9.735 12.226a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" />
                    <path d="M13.235 17.226l4-4" />
                  </svg>
                </button>
                <button
                  id="btn-mode-pinned"
                  class="explorer-pill-btn"
                  title="Pinned Notes"
                  aria-label="Pinned Notes"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M22 6v2.42C22 10 21 11 19.42 11H16V4.01C16 2.9 16.91 2 18.02 2c1.09.01 2.09.45 2.81 1.17C21.55 3.9 22 4.9 22 6z"
                    />
                    <path
                      d="M2 7v14c0 .83.94 1.3 1.6.8l1.71-1.28c.4-.3.96-.26 1.32.1l1.66 1.67c.39.39 1.03.39 1.42 0l1.68-1.68c.35-.35.91-.39 1.3-.09l1.71 1.28c.66.49 1.6.02 1.6-.8V4c0-1.1.9-2 2-2H6C3 2 2 3.79 2 6v1z"
                    />
                    <path d="M6 9h6M6.75 13h4.5" />
                  </svg>
                </button>
                <span class="toolbar-divider" aria-hidden="true"></span>
                <button
                  id="btn-new-note"
                  class="icon-btn action-pill-btn"
                  title="New Note"
                  aria-label="New Note"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path d="M21 7v10c0 3-1.5 5-5 5H8c-3.5 0-5-2-5-5V7c0-3 1.5-5 5-5h8c3.5 0 5 2 5 5z" />
                    <path d="M14.5 4.5v2c0 1.1.9 2 2 2h2M12 12.5v5M9.5 15h5" />
                  </svg>
                </button>
                <button
                  id="btn-new-folder"
                  class="icon-btn action-pill-btn"
                  title="New Folder"
                  aria-label="New Folder"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path d="M12.06 16.5v-5M14.5 14h-5" />
                    <path
                      d="M22 11v6c0 4-1 5-5 5H7c-4 0-5-1-5-5V7c0-4 1-5 5-5h1.5c1.5 0 1.83.44 2.4 1.2l1.5 2c.38.5.6.8 1.6.8h3c4 0 5 1 5 5z"
                    />
                  </svg>
                </button>
                <button
                  id="btn-toggle-search"
                  class="icon-btn action-pill-btn"
                  title="Search Notes &amp; Tags"
                  aria-label="Search Notes &amp; Tags"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M14 5H20M14 8H17M10 19C14.9706 19 19 14.9706 19 10C19 5.02944 14.9706 1 10 1C5.02944 1 1 5.02944 1 10C1 14.9706 5.02944 19 10 19Z"
                    />
                    <path d="M21 21L17 17" />
                  </svg>
                </button>
              </div>

              <!-- INLINE SEARCH — morphs over the toolbar row -->
              <div class="explorer-search" id="explorer-search">
                <svg
                  class="icon-svg search-lead"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    d="M14 5h6M14 8h3M21 11.5c0 5.25-4.25 9.5-9.5 9.5S2 16.75 2 11.5 6.25 2 11.5 2M22 22l-2-2"
                  />
                </svg>
                <input
                  type="search"
                  id="search-input"
                  class="search-input"
                  placeholder="Search notes &amp; tags…"
                  aria-label="Search notes and tags"
                />
                <button
                  id="btn-search-close"
                  class="search-close"
                  title="Close search (Esc)"
                  aria-label="Close search (Esc)"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-miterlimit="10"
                    stroke-width="1.5"
                  >
                    <path
                      d="M9 11.7h5M11.5 21a9.5 9.5 0 100-19 9.5 9.5 0 000 19zM22 22l-2-2"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div id="folder-tree" class="folder-tree"></div>
          <div id="tag-tree" class="tag-tree hidden"></div>
          <div id="pinned-tree" class="folder-tree hidden"></div>
        </div>

        <!-- TRASH — soft-delete holding area. The panel reveals above the row;
           restore via right-click or by dragging a note onto a live folder. -->
        <div id="trash-panel" class="trash-panel" hidden>
          <div
            id="trash-list"
            class="trash-list"
            role="tree"
            aria-label="Trash"
          ></div>
        </div>
        <button
          id="btn-mode-trash"
          class="trash-row"
          title="Trash"
          aria-label="Trash"
          aria-expanded="false"
        >
          <span id="trash-row-icon"
            ><svg
              class="icon-svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-miterlimit="10"
            >
              <path
                d="M21 5.98c-3.33-.33-6.68-.5-10.02-.5-1.98 0-3.96.1-5.94.3L3 5.98M8.5 4.97l.22-1.31C8.88 2.71 9 2 10.69 2h2.62c1.69 0 1.82.75 1.97 1.67l.22 1.3M18.85 9.14l-.65 10.07C18.09 20.78 18 22 15.21 22H8.79C6 22 5.91 20.78 5.8 19.21L5.15 9.14M10.33 16.5h3.33M9.5 12.5h5"
              /></svg
          ></span>
          <span>Trash</span>
        </button>

        <!-- SIDEBAR FOOTER CONTAINING E2EE STATUS, SYNC INDICATOR & LOCK BUTTON -->
        <footer class="sidebar-footer">
          <div class="e2ee-card" id="e2ee-card">
            <!-- Comfort row: theme, font, auto-lock — the user-preference controls -->
            <div class="e2ee-row">
              <button
                id="btn-theme"
                class="footer-pref-btn"
                title="Theme"
                aria-label="Theme"
              >
                <svg
                  class="icon-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-miterlimit="10"
                  stroke-width="1.5"
                >
                  <path
                    d="M14 16c0 1.77-.77 3.37-2 4.46A5.93 5.93 0 018 22c-3.31 0-6-2.69-6-6 0-2.76 1.88-5.1 4.42-5.79a6.019 6.019 0 004 3.58c.5.14 1.03.21 1.58.21s1.08-.07 1.58-.21c.27.68.42 1.43.42 2.21z"
                  />
                  <path
                    d="M18 8a5.993 5.993 0 01-4.42 5.79c-.5.14-1.03.21-1.58.21s-1.08-.07-1.58-.21A5.993 5.993 0 016 8c0-3.31 2.69-6 6-6s6 2.69 6 6z"
                  />
                  <path
                    d="M22 16c0 3.31-2.69 6-6 6a5.93 5.93 0 01-4-1.54c1.23-1.09 2-2.69 2-4.46 0-.78-.15-1.53-.42-2.21 1.83-.5 3.31-1.84 4-3.58C20.12 10.9 22 13.24 22 16z"
                  />
                </svg>
              </button>
              <button
                id="btn-fontset"
                class="footer-pref-btn"
                title="Interface font"
                aria-label="Interface font"
              >
                <svg
                  class="icon-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    d="M1.99 5.93V4.42c0-1.02.83-1.85 1.85-1.85h12.92c1.02 0 1.85.83 1.85 1.85v1.51M10.3 18.1V3.32M6.9 18.1h5.58M13.68 10.34h7.01c.73 0 1.32.59 1.32 1.32v.8M16.08 21.43V10.87M13.94 21.43h4.28"
                  />
                </svg>
              </button>
              <button
                id="btn-fontsize"
                class="footer-pref-btn"
                title="Adjust note text size (- Top-Left / + Bottom-Right)"
                aria-label="Adjust note text size"
              >
                <svg
                  class="icon-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path d="M21.97 15V9c0-5-2-7-7-7h-6c-5 0-7 2-7 7v6c0 5 2 7 7 7h6c5 0 7-2 7-7zM19.72 3.25L3.27 19.7"/>
                  <path d="M16.06 18v-5M18.5 15.5h-5M10.5 7.5h-5"/>
                </svg>
              </button>
              <button
                id="btn-autolock"
                class="footer-pref-btn"
                title="Auto-lock timeout"
                aria-label="Auto-lock timeout"
              >
                <svg
                  class="icon-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    d="M8.5 19h7c2.33 0 3.5-1.17 3.5-3.5v-7C19 6.17 17.83 5 15.5 5h-7C6.17 5 5 6.17 5 8.5v7C5 17.83 6.17 19 8.5 19zM16 2H8M16 22H8"
                  />
                  <path d="M11.5 9.5v3h3" />
                </svg>
              </button>
            </div>
            <div class="footer-actions-row">
              <div class="footer-status-cluster">
                <a
                  href="https://github.com/Arelius-D/LucID"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="footer-github-link"
                  title="View LucID Repository on GitHub"
                  aria-label="View LucID Repository on GitHub"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
                    ></path>
                  </svg>
                </a>
                <div
                  id="save-indicator"
                  class="sync-status-badge"
                  title="Synced to vault"
                  aria-label="Synced to vault"
                  role="button"
                  tabindex="0"
                  aria-live="polite"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M6.37 9.51c-4.08.29-4.07 6.2 0 6.49h9.66c1.17.01 2.3-.43 3.17-1.22 2.86-2.5 1.33-7.5-2.44-7.98C15.41-1.34 3.62 1.75 6.41 9.51M12 16v3M12 23a2 2 0 100-4 2 2 0 000 4zM18 21h-4M10 21H6"
                    />
                  </svg>
                  <span class="visually-hidden">Synced</span>
                </div>
                <div
                  id="runtime-indicator"
                  class="runtime-badge"
                  title="Checking server runtime"
                  aria-label="Checking server runtime"
                  role="button"
                  tabindex="0"
                >
                  <svg
                    class="icon-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7z"
                    />
                    <path
                      d="M7.33 14.49l2.38-3.09c.34-.44.97-.52 1.41-.18l1.83 1.44c.44.34 1.07.26 1.41-.17l2.31-2.98"
                    />
                  </svg>
                </div>
              </div>
              <!-- Security corner: the lock button carries the vault's posture in its
                 own glyph, so no separate badge restates it -->
              <div class="footer-security-cluster">
                <button
                  id="btn-lock-vault"
                  class="icon-btn lock-action-btn"
                  title="Lock Encrypted Vault"
                  aria-label="Lock Encrypted Vault"
                >
                  <span class="lock-glyph"></span>
                  <span>Lock</span>
                </button>
              </div>
            </div>
          </div>
        </footer>
      </nav>

      <!-- LEFT RESIZER -->
      <div
        id="resizer-left"
        class="sidebar-resizer"
        title="Drag to resize sidebar"
      ></div>

      <!-- CENTER PANE -->
      <main id="main-editor" class="center-pane">
        <!-- CLEAN TOP BAR -->
        <header class="top-bar">
          <div class="top-bar-left">
            <!-- CLEAN DOCKED EXPAND SIDEBAR BUTTON IN TOP BAR -->
            <button
              id="btn-expand-left"
              class="icon-btn docked-expand-btn hidden"
              title="Expand Sidebar"
              aria-label="Expand Sidebar"
            >
              <svg
                class="icon-svg pane-show-left"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7zM9 2v20"
                />
              </svg>
            </button>

            <!-- VIEW MODE TABS WITH DYNAMIC ICONSAX SVGS -->
            <div class="view-tabs">
              <button
                id="tab-mode-editor"
                class="view-tab active"
                title="Editor Only"
                aria-label="Editor Only"
              >
                <svg
                  class="icon-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-miterlimit="10"
                  stroke-width="1.5"
                >
                  <path
                    d="M6.89 9c.98.49 1.82 1.23 2.43 2.15.35.52.35 1.19 0 1.71-.61.91-1.45 1.65-2.43 2.14M13 15h4"
                  />
                  <path
                    d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7z"
                  />
                </svg>
                <span>Editor</span>
              </button>
              <button
                id="tab-mode-split"
                class="view-tab"
                title="Toggle Split Orientation (Side-by-Side ↔ Top-Bottom)"
                aria-label="Toggle Split Orientation (Side-by-Side ↔ Top-Bottom)"
              >
                <!-- Must be the geometry of ICONS.element2, the icon setViewMode() injects
                   for DEFAULT_VIEW_MODE ('split-vertical'). Markup that disagrees with
                   what JS writes over it flashes the wrong glyph on first paint. -->
                <span class="split-tab-icon"
                  ><svg
                    class="icon-svg turn-90"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7zM12 2v20"
                    /></svg
                ></span>
                <span>Split</span>
              </button>
              <button
                id="tab-mode-preview"
                class="view-tab"
                title="Preview Only"
                aria-label="Preview Only"
              >
                <svg
                  class="icon-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-miterlimit="10"
                  stroke-width="1.5"
                >
                  <path
                    d="M15.58 12c0 1.98-1.6 3.58-3.58 3.58S8.42 13.98 8.42 12s1.6-3.58 3.58-3.58 3.58 1.6 3.58 3.58z"
                  />
                  <path
                    d="M12 20.27c3.53 0 6.82-2.08 9.11-5.68.9-1.41.9-3.78 0-5.19-2.29-3.6-5.58-5.68-9.11-5.68-3.53 0-6.82 2.08-9.11 5.68-.9 1.41-.9 3.78 0 5.19 2.29 3.6 5.58 5.68 9.11 5.68z"
                  />
                </svg>
                <span>Preview</span>
              </button>
            </div>
          </div>

          <div class="top-bar-right">
            <!-- Occasional actions, kept beside the view tabs because that is where
               the eyes and the cursor already are while writing or reading. -->
            <button
              id="btn-download"
              class="icon-btn"
              title="Download note as Markdown (.md)"
              aria-label="Download note as Markdown (.md)"
            >
              <svg
                class="icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path d="M9 11v6l2-2M9 17l-2-2" />
                <path d="M22 10v5c0 5-2 7-7 7H9c-5 0-7-2-7-7V9c0-5 2-7 7-7h5" />
                <path d="M22 10h-4c-3 0-4-1-4-4V2l8 8z" />
              </svg>
            </button>
            <button
              id="btn-print"
              class="icon-btn"
              title="Print or save the note as PDF"
              aria-label="Print or save the note as PDF"
            >
              <svg
                class="icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-miterlimit="10"
                stroke-width="1.5"
              >
                <path
                  d="M7.25 7h9.5V5c0-2-.75-3-3-3h-3.5c-2.25 0-3 1-3 3v2zM16 15v4c0 2-1 3-3 3h-2c-2 0-3-1-3-3v-4h8z"
                />
                <path
                  d="M21 10v5c0 2-1 3-3 3h-2v-3H8v3H6c-2 0-3-1-3-3v-5c0-2 1-3 3-3h12c2 0 3 1 3 3zM17 15H7M7 11h3"
                />
              </svg>
            </button>
            <button
              id="btn-focus"
              class="icon-btn"
              title="Focus mode (fullscreen)"
              aria-label="Focus mode (fullscreen)"
              aria-pressed="false"
            >
              <svg
                class="icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7zM18 6L6 18"
                />
                <path d="M18 10V6h-4M6 14v4h4" />
              </svg>
            </button>
            <!-- DOCKED EXPAND INSPECTOR BUTTON — mirrors the left docked-expand;
               only visible when the inspector is collapsed -->
            <button
              id="btn-expand-right"
              class="icon-btn docked-expand-btn dock-right"
              title="Expand Inspector"
              aria-label="Expand Inspector"
            >
              <svg
                class="icon-svg pane-show-right"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7zM9 2v20"
                />
              </svg>
            </button>
          </div>
        </header>

        <!-- AUTO-FIT EDITOR/PREVIEW PANE -->
        <div id="editor-split" class="editor-split mode-editor">
          <div class="editor-pane">
            <textarea
              id="markdown-textarea"
              spellcheck="true"
              placeholder="Start writing in Markdown…"
            ></textarea>
          </div>
          <div class="split-handle" id="split-handle">
            <div class="handle-line"></div>
          </div>
          <div class="preview-pane">
            <div id="markdown-preview" class="preview-content"></div>
          </div>
        </div>
      </main>

      <!-- RIGHT RESIZER -->
      <div
        id="resizer-right"
        class="sidebar-resizer"
        title="Drag to resize inspector"
      ></div>

      <!-- RIGHT SIDEBAR (COLLAPSED BY DEFAULT) -->
      <aside id="sidebar-right" class="sidebar right-pane collapsed">
        <!-- INSPECTOR HEADER — collapse button lives inside the panel, next to the
           center divider (mirrors the left panel's in-panel collapse button) -->
        <header class="inspector-header">
          <button
            id="btn-toggle-right"
            class="icon-btn inspector-collapse-btn"
            title="Collapse inspector"
            aria-label="Collapse inspector"
          >
            <svg
              class="icon-svg pane-hide-right"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path
                d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7zM9 2v20"
              />
            </svg>
          </button>
        </header>
        <div class="inspector-body">
          <section>
            <h6>TABLE OF CONTENTS</h6>
            <div id="toc-container" class="toc-list">
              <small class="empty-state">No headings</small>
            </div>
          </section>
          <section>
            <div class="tags-header">
              <h6>TAGS</h6>
              <button
                id="btn-add-tag"
                class="btn-tag-add"
                title="Add Tag"
                aria-label="Add Tag"
              >
                +
              </button>
            </div>
            <div id="tags-container" class="tags-list"></div>
          </section>
          <section>
            <h6>METRICS</h6>
            <div class="metrics-grid">
              <div class="metric">
                <strong id="val-words">0</strong><small>Words</small>
              </div>
              <div class="metric">
                <strong id="val-chars">0</strong><small>Chars</small>
              </div>
              <div class="metric">
                <strong id="val-lines">0</strong><small>Lines</small>
              </div>
            </div>
          </section>
        </div>
      </aside>
    </div>

    <!-- RIGHT-CLICK TREE CONTEXT MENU -->
    <div id="tree-context-menu" class="context-menu hidden"></div>

    <!-- IN-APP PROMPT MODAL -->
    <div
      id="modal-prompt"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-prompt-title"
    >
      <div class="modal-card">
        <div class="modal-icon" id="modal-prompt-icon">
          <svg
            class="modal-prompt-svg icon-svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path d="M12.06 16.5v-5M14.5 14h-5" />
            <path
              d="M22 11v6c0 4-1 5-5 5H7c-4 0-5-1-5-5V7c0-4 1-5 5-5h1.5c1.5 0 1.83.44 2.4 1.2l1.5 2c.38.5.6.8 1.6.8h3c4 0 5 1 5 5z"
            />
          </svg>
        </div>
        <h3 id="modal-prompt-title">New Folder</h3>
        <p id="modal-prompt-msg">Enter a name for the new folder:</p>
        <input
          type="text"
          id="modal-prompt-input"
          class="modal-input"
          placeholder="Name"
          aria-label="Name"
          autofocus
        />
        <div class="modal-actions">
          <button id="modal-prompt-btn-cancel" class="btn-modal-secondary">
            Cancel
          </button>
          <button id="modal-prompt-btn-submit" class="btn-modal-primary">
            Submit
          </button>
        </div>
      </div>
    </div>

    <!-- IN-APP CONFIRMATION MODAL -->
    <div
      id="modal-confirm"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-confirm-title"
    >
      <div class="modal-card">
        <div class="modal-icon">
          <svg
            class="modal-warning-svg icon-svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <path
              d="M9.17 14.83l5.66-5.66M14.83 14.83L9.17 9.17M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7z"
            />
          </svg>
        </div>
        <h3 id="modal-confirm-title">Confirm Action</h3>
        <p id="modal-confirm-msg">Are you sure you want to proceed?</p>
        <div class="modal-actions">
          <button id="modal-btn-cancel" class="btn-modal-secondary">
            Cancel
          </button>
          <button id="modal-btn-danger" class="btn-modal-danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- LOCK SCREEN -->
    <div
      id="lock-screen"
      class="lock-screen"
      role="dialog"
      aria-modal="true"
      aria-label="LucID vault"
    >
      <div class="lock-card">
        <div class="lock-icon">
          <img
            src="assets/branding/logo.png"
            class="lock-logo-img"
            alt="LucID"
          />
        </div>
        <!-- One status line for all three states: it says where you are, and the
           button says what to do. Icon and text are set by updateLockScreenUI. -->
        <div id="lock-status" class="lock-status">
          <span id="lock-status-icon"></span>
          <span id="lock-status-text">Vault locked</span>
        </div>
        <div class="lock-inputs-group" id="lock-inputs">
          <div class="lock-input-wrap">
            <span
              id="lock-capslock"
              class="lock-caps-flag hidden"
              role="status"
              aria-live="polite"
              title="Caps Lock is on"
            >
              <svg
                class="icon-svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-miterlimit="10"
                stroke-width="1.5"
              >
                <path
                  d="M9.17 4.71L3.07 16.3c-1.45 2.75 1.48 5.74 4.26 4.35l3.24-1.62c.9-.45 1.96-.45 2.86 0l3.24 1.62c2.78 1.39 5.7-1.6 4.26-4.35l-6.1-11.59c-1.2-2.28-4.46-2.28-5.66 0z"
                />
              </svg>
              <span class="visually-hidden">Caps Lock is on</span>
            </span>
            <input
              type="password"
              id="lock-passphrase"
              class="lock-input"
              placeholder="Master passphrase"
              aria-label="Master passphrase"
              aria-describedby="lock-error"
              autofocus
            />
            <button
              type="button"
              id="lock-reveal-btn"
              class="lock-reveal"
              title="Show passphrase"
              aria-label="Show passphrase"
            >
              <span class="icon-eye"
                ><svg
                  class="icon-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    d="M15.58 12c0 1.98-1.6 3.58-3.58 3.58S8.42 13.98 8.42 12s1.6-3.58 3.58-3.58 3.58 1.6 3.58 3.58z"
                  />
                  <path
                    d="M12 20.27c3.53 0 6.82-2.08 9.11-5.68.9-1.41.9-3.78 0-5.19-2.29-3.6-5.58-5.68-9.11-5.68-3.53 0-6.82 2.08-9.11 5.68-.9 1.41-.9 3.78 0 5.19 2.29 3.6 5.58 5.68 9.11 5.68z"
                  /></svg
              ></span>
              <span class="icon-eye-slash"
                ><svg
                  class="icon-svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path d="M14.53 9.47l-5.06 5.06a3.576 3.576 0 115.06-5.06z" />
                  <path
                    d="M17.82 5.77C16.07 4.45 14.07 3.73 12 3.73c-3.53 0-6.82 2.08-9.11 5.68-.9 1.41-.9 3.78 0 5.19.79 1.24 1.71 2.31 2.71 3.17M8.42 19.53c1.14.48 2.35.74 3.58.74 3.53 0 6.82-2.08 9.11-5.68.9-1.41.9-3.78 0-5.19-.33-.52-.69-1.01-1.06-1.47M15.51 12.7a3.565 3.565 0 01-2.82 2.82M9.47 14.53L2 22M22 2l-7.47 7.47"
                  /></svg
              ></span>
            </button>
          </div>
          <input
            type="password"
            id="lock-passphrase-confirm"
            class="lock-input hidden"
            placeholder="Confirm master passphrase"
            aria-label="Confirm master passphrase"
          />
        </div>
        <!-- Reserved slot: caps-lock warning and failures share one fixed-height
           row, so the card never shifts under the cursor mid-click. -->
        <div class="lock-msg-slot">
          <div
            id="lock-error"
            class="lock-error hidden"
            role="alert"
            aria-live="assertive"
          ></div>
        </div>
        <button id="lock-unlock-btn" class="lock-btn">Unlock</button>
        <small id="lock-footer" class="lock-footer"
          >Your passphrase never leaves this browser.<br />If you forget it,
          your data cannot be recovered.</small
        >
      </div>
    </div>

    <script src="app.js?v=2.11.0-dev"></script>
  </body>
</html>
